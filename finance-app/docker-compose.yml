# Finance-Tracker — deployment topology
#
# Secrets live in .env (see .env.example), never in this file.
#
#     cp .env.example .env               # DATABASE_URL, POSTGRES_* if you use the db profile
#     npm run auth:setup -- --env .env   # generate the login password
#     docker compose up -d --build
#
# IMPORTANT: by default this starts ONLY `app` and `worker`, and expects
# DATABASE_URL to point at a Postgres you already run. On the NAS that is the
# standalone `finance_app_db` container, which is not managed by this file — it
# predates it and holds the real data. Defining a `postgres` service here
# unconditionally would stand up a second, empty database alongside it.
#
# For a fresh install with no database yet, add the profile:
#
#     docker compose --profile with-db up -d --build
#     docker compose exec -T postgres psql -U finance -d finance < db/schema.sql
#     docker compose exec -T postgres psql -U finance -d finance < db/seed.sql
#
# An existing database predating db/schema.sql needs
# db/migrations/0001_integrity.sql applied first. See README.md.
#
# Container names match the ones already running on the NAS, so `docker compose
# up -d` replaces them in place rather than leaving duplicates behind.

services:
  # Only started with `--profile with-db`. See the note above.
  postgres:
    image: postgres:18-alpine
    profiles: ["with-db"]
    container_name: finance_app_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-finance}
      # Not `:?required`: docker compose interpolates every service's
      # environment before profiles are applied, so a required-variable error
      # here fired even when --profile with-db was not passed and this
      # service was never going to start. Falls back to a value that is
      # merely useless, not fatal, when the profile is off; still required in
      # spirit when you actually bring this service up.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-set-POSTGRES_PASSWORD-in-.env-before-using---profile-with-db}
      POSTGRES_DB: ${POSTGRES_DB:-finance}
      TZ: America/New_York
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finance} -d ${POSTGRES_DB:-finance}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: finance_app
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      TZ: America/New_York
      NODE_ENV: production
      # Fail-closed: without these the app refuses every request rather than
      # serving the dashboard unauthenticated. Generate with
      # `npm run auth:setup -- --env .env`.
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env — see npm run auth:setup}
      AUTH_PASSWORD_HASH: ${AUTH_PASSWORD_HASH:?set AUTH_PASSWORD_HASH in .env — see npm run auth:setup}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
    ports:
      - "${APP_PORT:-3000}:3000"
    # The image's HEALTHCHECK hits /api/health, which round-trips the database.
    #
    # No `depends_on`: the database is normally external to this file, so there
    # is nothing here to wait on. The app retries its connection anyway, and
    # the healthcheck reports unhealthy until Postgres answers.

  # Same image, different entrypoint. Runs node-cron in the foreground and
  # shells out to the two scripts on schedule.
  #
  # dist/worker.mjs, not `npm run worker`: the runtime image ships the bundled
  # worker rather than the TypeScript sources and tsx. To run a job by hand:
  #   docker compose exec worker node dist/scripts/process-recurring-payments.mjs
  worker:
    build: .
    container_name: finance_worker
    restart: unless-stopped
    command: ["node", "dist/worker.mjs"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      TZ: America/New_York
      NODE_ENV: production
    # The image's HEALTHCHECK is an HTTP probe against the Next server, which
    # this service does not run. Left enabled it would report the worker
    # permanently unhealthy.
    healthcheck:
      disable: true

volumes:
  postgres-data:
